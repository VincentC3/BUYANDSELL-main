<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/style.css?v=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=1.0"></script>
</head>
<body style="font-family:sans-serif;max-width:380px;margin:4rem auto;padding:0 1rem">
  <h2>Reset Password</h2>
  <p id="msg">Checking your reset link…</p>
  <div id="formBox" hidden>
    <input type="password" id="pw1" placeholder="New password (8+ characters)" style="width:100%;padding:10px;margin-bottom:10px">
    <input type="password" id="pw2" placeholder="Re-enter new password" style="width:100%;padding:10px;margin-bottom:10px">
    <button id="saveBtn" style="padding:10px 16px">Save New Password</button>
  </div>

  <script>
    var C = window.PALIT_CONFIG;
    var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    var msg = document.getElementById('msg');
    var box = document.getElementById('formBox');

    function ready() { msg.textContent = 'Enter your new password.'; box.hidden = false; }

    sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') ready();
    });
    // fallback kung na-parse na agad ang link
    sb.auth.getSession().then(function (r) {
      if (r.data.session) ready();
      else setTimeout(function () {
        if (box.hidden) msg.textContent = 'Invalid or expired link. Request a new one from the login page.';
      }, 2000);
    });

    document.getElementById('saveBtn').addEventListener('click', function () {
      var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
      if (a.length < 8) return alert('Password needs at least 8 characters.');
      if (a !== b) return alert('Passwords do not match.');
      sb.auth.updateUser({ password: a }).then(function (r) {
        if (r.error) return alert(r.error.message);
        alert('Na-reset na! Mag-login ka na.');
        sb.auth.signOut({ scope: 'local' }).then(function () { location.href = 'index.html#/auth?mode=login'; });
      });
    });
  </script>
</body>
</html>
